<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Anomalía de Entropía</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0B0F19; /* Dark background matching the screenshot */
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .logo-container {
            border: 1px solid #333;
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .logo-container img {
            max-width: 100%;
            max-height: 100%;
        }
        h1.error-code {
            font-size: 8rem;
            color: #FF0055;
            margin: 0;
            font-family: serif; /* Matching the serif font in screenshot */
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            font-weight: bold;
        }
        h2.error-title {
            font-size: 2rem;
            margin: 1rem 0;
            font-weight: 400;
        }
        p.error-desc {
            color: #b0b0b0;
            font-size: 1.2rem;
            margin-bottom: 3rem;
            max-width: 600px;
        }
        a.back-link {
            color: #0000FF; /* Blue link matching the screenshot */
            text-decoration: underline;
            font-size: 1.1rem;
        }
        a.back-link:hover {
            color: #0055ff;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Usa absolute path /assets/ para que funcione desde cualquier subruta en GitHub Pages -->
        <img src="assets/logo_nexord_base.png" alt="NEX_ORD Logo" onerror="this.style.display='none'">
    </div>

    <h1 class="error-code">404</h1>
    <h2 class="error-title">Anomalía de Entropía Detectada</h2>
    <p class="error-desc">Parece que te has salido del ecosistema. Esta ruta no existe en el mapa sociométrico.</p>
    
    <a href="index.html" class="back-link">Volver a la Base de Control</a>

</body>
</html>
